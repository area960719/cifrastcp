<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CifrasTCP</title>
    <!-- Tailwind para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        input, select { background-color: #1e293b; color: white; border: 1px solid #334155; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
    </style>
</head>
<body class="pb-10">

    <!-- Encabezado -->
    <header class="bg-blue-600 p-6 rounded-b-3xl shadow-lg text-center">
        <h1 class="text-3xl font-bold">📊 CifrasTCP</h1>
        <p class="text-blue-100 mt-1">Tu negocio, bajo control</p>
        <button id="btn-notificaciones" class="mt-3 bg-yellow-500 text-black px-4 py-1 rounded-full text-sm font-bold shadow">🔔 Activar Recordatorios</button>

        <!-- Usuario conectado -->
        <div id="barra-usuario" class="hidden mt-3 flex items-center justify-center gap-2 text-sm">
            <span id="usuario-email" class="text-blue-100 truncate max-w-[200px]"></span>
            <button id="btn-salir" class="bg-slate-900 bg-opacity-40 px-3 py-1 rounded-full font-bold">Salir</button>
        </div>
    </header>

    <main class="p-4 max-w-md mx-auto">

        <!-- Inicio de sesión / registro -->
        <section id="seccion-auth" class="bg-slate-800 p-4 rounded-xl shadow-md mb-4">
            <h3 class="font-bold text-lg mb-1">Accede a tu cuenta</h3>
            <p class="text-sm text-gray-400 mb-3">Cada usuario ve solo sus propios registros.</p>
            <form id="form-auth" class="flex flex-col gap-3">
                <input type="email" id="auth-email" placeholder="Correo electrónico" required autocomplete="email" class="p-2 rounded-lg">
                <input type="password" id="auth-password" placeholder="Contraseña (mínimo 6 caracteres)" required minlength="6" autocomplete="current-password" class="p-2 rounded-lg">
                <button type="submit" id="btn-entrar" class="bg-blue-600 text-white font-bold py-2 rounded-lg shadow hover:bg-blue-700">Entrar</button>
                <button type="button" id="btn-registro" class="bg-slate-700 text-white font-bold py-2 rounded-lg shadow hover:bg-slate-600">Crear cuenta nueva</button>
            </form>
            <p id="auth-mensaje" class="text-sm mt-3 text-center"></p>
        </section>

        <!-- Contenido de la app (solo con sesión iniciada) -->
        <div id="contenido-app" class="hidden">

            <!-- Resumen -->
            <div class="bg-slate-800 p-4 rounded-xl shadow-md mb-4 text-center">
                <p class="text-sm text-gray-400">Balance Total</p>
                <h2 id="balance-total" class="text-3xl font-bold text-green-400">0.00 CUP</h2>
            </div>

            <!-- Formulario Ingresos / Gastos -->
            <section class="bg-slate-800 p-4 rounded-xl shadow-md mb-4">
                <h3 class="font-bold text-lg mb-3">Agregar Movimiento</h3>
                <form id="form-movimiento" class="flex flex-col gap-3">
                    <select id="tipo-mov" class="p-2 rounded-lg">
                        <option value="ingreso">🟢 Ingreso</option>
                        <option value="gasto">🔴 Gasto</option>
                    </select>
                    <input type="number" step="any" id="monto-mov" placeholder="Monto (CUP)" required class="p-2 rounded-lg">
                    <input type="text" id="desc-mov" placeholder="Descripción (Ej: Venta, Compra)" required class="p-2 rounded-lg">
                    <button type="submit" id="btn-guardar-mov" class="bg-blue-600 text-white font-bold py-2 rounded-lg shadow hover:bg-blue-700">Guardar Movimiento</button>
                    <button type="button" id="btn-cancelar-mov" class="hidden bg-slate-700 text-white font-bold py-2 rounded-lg">Cancelar edición</button>
                </form>
            </section>

            <!-- Formulario ONAT -->
            <section class="bg-slate-800 p-4 rounded-xl shadow-md mb-4 border-l-4 border-purple-500">
                <h3 class="font-bold text-lg mb-3 text-purple-400">Pago ONAT</h3>
                <form id="form-onat" class="flex flex-col gap-3">
                    <label class="text-sm text-gray-400">Fecha de pago</label>
                    <input type="date" id="fecha-onat" required class="p-2 rounded-lg">

                    <label class="text-sm text-gray-400">Depósito en cuenta fiscal</label>
                    <input type="number" step="any" id="deposito-onat" placeholder="0.00 CUP" required class="p-2 rounded-lg">

                    <label class="text-sm text-gray-400">Monto pagado a la ONAT</label>
                    <input type="number" step="any" id="pago-onat" placeholder="0.00 CUP" required class="p-2 rounded-lg">

                    <button type="submit" id="btn-guardar-onat" class="bg-purple-600 text-white font-bold py-2 rounded-lg shadow hover:bg-purple-700">Registrar Pago</button>
                    <button type="button" id="btn-cancelar-onat" class="hidden bg-slate-700 text-white font-bold py-2 rounded-lg">Cancelar edición</button>
                </form>
            </section>

            <!-- Historial de movimientos -->
            <section class="mt-6">
                <h3 class="font-bold text-lg mb-2">Últimos Registros</h3>
                <div id="lista-registros" class="flex flex-col gap-2"></div>
            </section>

            <!-- Historial de pagos ONAT -->
            <section class="mt-6">
                <h3 class="font-bold text-lg mb-1 text-purple-400">Historial de Pagos ONAT</h3>
                <p id="resumen-onat" class="text-sm text-gray-400 mb-2"></p>
                <div id="lista-onat" class="flex flex-col gap-2"></div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
